<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Festival of Darkness 2 — Design Selector</title>
  <style>
    :root {
      --bg: #0b0c10;
      --surface: #13151c;
      --surface-hover: #1b1e28;
      --border: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(167, 139, 250, 0.55);
      --text: #f3f4f6;
      --muted: #9ca3af;
      --accent: #a78bfa;
      --accent-glow: rgba(167, 139, 250, 0.16);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 20% 0%, rgba(167, 139, 250, 0.12), transparent 45%),
        radial-gradient(circle at 80% 100%, rgba(56, 189, 248, 0.08), transparent 45%),
        var(--bg);
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
      padding: 48px 20px 64px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .container {
      width: 100%;
      max-width: 820px;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    .eyebrow {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      background: var(--accent-glow);
      border: 1px solid rgba(167, 139, 250, 0.25);
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 14px;
    }

    h1 {
      font-size: clamp(1.75rem, 4vw, 2.5rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.98rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 14px;
    }

    .card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: flex-start;
      gap: 18px;
      padding: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      text-decoration: none;
      color: var(--text);
      transition: transform 0.16s ease, background 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
    }

    .card:hover,
    .card:focus-visible {
      transform: translateY(-2px);
      background: var(--surface-hover);
      border-color: var(--border-hover);
      box-shadow: 0 10px 28px -8px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(167, 139, 250, 0.2);
      outline: none;
    }

    .num {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .action {
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: color 0.16s ease;
    }

    .card:hover .action,
    .card:focus-visible .action {
      color: var(--accent);
    }

    footer {
      margin-top: 40px;
      text-align: center;
      color: var(--muted);
      font-size: 0.82rem;
    }
  </style>
</head>
<body>
